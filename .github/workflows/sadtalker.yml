name: Talking Cartoon (SadTalker)

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Line numbers to render (space-separated, e.g. "2 4 6")'
        required: false
        default: 'all'
        type: string
  push:
    branches: [main]
    paths:
      - "video-factory/talking/**"

permissions:
  contents: write

concurrency:
  group: sadtalker
  cancel-in-progress: false

jobs:
  sadtalker:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout factory repo
        uses: actions/checkout@v4

      - name: Select lines (Sunita pre-check)
        id: select
        run: |
          set -euo pipefail
          cd video-factory/talking
          ls -lh
          echo "--- portraits ---"
          ls -lh portrait*.png 2>/dev/null || true
          echo "--- audio ---"
          ls -lh line*.wav 2>/dev/null || true
          echo "--- requested: '${{ inputs.lines }}' ---"
          # Pre-check: face detection availability for the selected Sunita portrait.
          # The render step uses portrait.png (copied below); this step only reports
          # which portrait files exist so a bad selection fails fast with a clear log.
          if [ ! -f portrait.png ]; then
            echo "::error::portrait.png missing in video-factory/talking"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          req = os.environ.get("LINES", "all").strip()
          print(f"requested lines input: {req!r}")
          PY
        env:
          LINES: ${{ inputs.lines }}

      - name: Decode talking inputs (base64 -> png/wav)
        run: |
          cd video-factory/talking
          for f in *.b64; do
            base64 -d "$f" > "${f%.b64}"
            echo "decoded: $f -> ${f%.b64}"
          done
          cp portrait.png ramesh.png
          ls -lh

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Clone SadTalker
        run: git clone --depth 1 https://github.com/OpenTalker/SadTalker.git sadtalker

      - name: Restore SadTalker checkpoints cache
        uses: actions/cache@v4
        with:
          path: sadtalker/checkpoints
          key: sadtalker-checkpoints-v0.0.2-256-v2

      - name: Download SadTalker checkpoints (256 model, no GFPGAN enhancer)
        run: |
          mkdir -p sadtalker/checkpoints
          cd sadtalker/checkpoints
          wget -nc https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/mapping_00109-model.pth
          wget -nc https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/mapping_00229-model.pth
          wget -nc https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2/auido2exp_00300-model.pth
          wget -nc https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2/auido2pose_00140-model.pth
          wget -nc https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2/epoch_20.pth
          ls -lh

      - name: Install SadTalker deps (CPU)
        run: |
          cd sadtalker
          python -m pip install --upgrade pip
          pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install "numpy<2" librosa==0.10.2.post1 face-alignment==1.4.1 safetensors

      - name: Generate talking videos (one per line, Sunita portrait)
        run: |
          set -euo pipefail
          cd sadtalker
          mkdir -p ../video-factory/talking/out
          REQ="${{ inputs.lines }}"
          echo "requested lines: '$REQ'"
          if [ -z "$REQ" ] || [ "$REQ" = "all" ]; then
            SEL=""
          else
            SEL="$REQ"
          fi
          for wav in ../video-factory/talking/line*.wav; do
            [ -e "$wav" ] || continue
            base=$(basename "$wav" .wav)
            num=${base#line}
            if [ -n "$SEL" ]; then
              case " $SEL " in
                *" $num "*) ;;
                *) echo "skip $base (not in '$SEL')"; continue ;;
              esac
            fi
            echo "=== render $base (line $num) ==="
            python inference.py \
              --driven_audio "$wav" \
              --source_image ../video-factory/talking/portrait.png \
              --result_dir ../video-factory/talking/out \
              --still \
              --preprocess full \
              --size 256 \
              --enhancer gfpgan
            # rename the produced mp4 to a stable per-line name
            f=$(ls -t ../video-factory/talking/out/*.mp4 | head -1)
            mv "$f" "../video-factory/talking/out/${base}.mp4"
            ls -lh ../video-factory/talking/out/
          done
          echo "=== outputs ==="
          ls -lh ../video-factory/talking/out/

      - name: Commit talking videos back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-factory/talking/out/*.mp4
          if git diff --cached --quiet; then
            echo "no new videos to commit"
          else
            git commit -m "SadTalker: talking videos (lines: ${{ inputs.lines }})"
            git push
          fi
